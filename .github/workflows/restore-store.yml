name: restore-store
on:
  push:
    paths:
      - .github/workflows/restore-store.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore store.ts
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/OPtgmsiX.ts" -o portal/packages/control-plane/src/store.ts
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          data = Path("portal/packages/control-plane/src/store.ts").read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != 105782 or digest != "877ca5cead1b52c17b35b505d453f29fbc215d1667606b8c7908f78807a4bfd8":
              raise SystemExit(f"bad store.ts {len(data)} {digest}")
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add portal/packages/control-plane/src/store.ts
          git rm -f .github/workflows/restore-store.yml
          git commit -m "Add sanitized source"
          git push
