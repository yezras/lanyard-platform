name: restore-one
on:
  push:
    paths:
      - .github/workflows/restore-one.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore file
        run: |
          set -euo pipefail
          dest="portal/packages/control-plane/src/app.ts"
          curl -fsSL "https://h.uguu.se/tiuACplZ.ts" -o "$dest"
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          data = Path("portal/packages/control-plane/src/app.ts").read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != 124344 or digest != "c6504b8a92f53dc0b65bb0da809ad93a4e31224e238a38c5c5600f0f428c50f2":
              raise SystemExit(f"bad file {len(data)} {digest}")
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$dest"
          git rm -f .github/workflows/restore-one.yml
          git commit -m "Add sanitized source"
          git push
