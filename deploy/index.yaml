# Machine-readable map of company-brain-deploy (canonical client deployment surface).
# Core is employee-vault only and must not be required at deploy time.

name: company-brain-deploy
purpose: Canonical client deployment for Lanyard Company Brain hosts
version: 0.2.0
milestone: 2

doctrine:
  core_dependency: none
  bootstrap: artifact_contract
  vault_durability: ebs_dlm
  portal_posture: egress_only_relay
  portal_canonical_url: https://app.withlanyard.com/<tenant_slug>
  portal_canonical_api_path: /<tenant_slug>/api/*
  portal_tenant_subdomains: legacy_compatibility_only
  default_roles:
    - admin
    - contributor
  customer_git_workflow: false
  floating_git_refs: false
  oidc_provider: require_existing_arn

paths:
  modules:
    company-brain-ec2:
      path: modules/company-brain-ec2
      purpose: EC2 + encrypted EBS + DLM (opt-in cross-region copy / DR-account share default off) + optional snapshot-age alarm + SSM-first + controlled egress + optional Tailscale secondary + golden AMI + optional host log shipping + hermes-gateway systemd sandbox + artifact-aware user_data
    customer-gateway-relay:
      path: modules/customer-gateway-relay
      purpose: GATEWAY_RELAY_* env wiring from control-plane provision; production secrets via SSM/Secrets Manager references only
    tier3-dedicated-relay:
      path: modules/tier3-dedicated-relay
      purpose: Per-tenant dedicated relay (public ALB + private Fargate via portal-relay-service); hostname/WSS contract; secrets map; optional Route53/WAF; digest pin
      status: infra_ready_not_auto_applied
      smoke: scripts/smoke-tier3-dedicated-relay.sh
      runbook: references/runbooks/tier3-dedicated-relay-apply.md
    product-artifact-infra:
      path: modules/product-artifact-infra
      purpose: Private S3 product artifacts (versioning + Object Lock), Portal ECR (immutable), optional GHA OIDC publishers
    chat-corpus-infra:
      path: modules/chat-corpus-infra
      purpose: L10 chat corpus dedicated S3 + KMS/SSE + lifecycle TTL + writer/reader IAM; Deny vault paths (lp-gkh.3)
      status: infra_ready_not_auto_applied
      smoke: scripts/smoke-chat-corpus-infra.sh
      design: ../docs/plans/0011-tenant-chat-corpus/infra-bucket-iam-lifecycle.md
    sandbox-vault-mount-iam:
      path: modules/sandbox-vault-mount-iam
      purpose: Shared base IAM role for Daytona sandbox vault Mountpoint; CP task AssumeRole; per-tenant STS session policy template (lp-zuh.9.1)
      status: lab_applied_infra_ready
      smoke: scripts/smoke-sandbox-vault-mount-iam.sh
      design: ../docs/plans/0008-daytona-agent-sandboxes/iam-scoped-s3-mount-policy.md
      lab_root: deployments/lab-sandbox-vault-mount-iam
    harness-exec-iam:
      path: modules/harness-exec-iam
      purpose: ECS task execution role for the shared Fargate harness; GetSecretValue on harness-service-token, harness-litellm, daytona (lp-oop.38.20)
      status: infra_ready_not_auto_applied
      smoke: scripts/smoke-harness-exec-iam.sh
    control-plane-rds:
      path: modules/control-plane-rds
      purpose: Private encrypted RDS Postgres for control plane; Secrets Manager CONTROL_PLANE_DATABASE_URL; fail-closed no public access
      status: infra_ready_not_auto_applied
    platform-vpc:
      path: modules/platform-vpc
      purpose: Two-AZ public/private platform VPC for Portal compute; NAT and/or VPC endpoints (ECR, Logs, Secrets Manager, SSM, S3); fail-closed private map_public_ip
    portal-valkey:
      path: modules/portal-valkey
      purpose: Private encrypted ElastiCache Valkey for Portal shared state; Secrets Manager REDIS_URL (TLS); BFF/relay secrets map consumers via redis_url_secret_arn; fail-closed no public access
      status: infra_ready_not_auto_applied
    portal-dns-tls:
      path: modules/portal-dns-tls
      purpose: Route53 aliases + ACM certificates for Portal web (us-east-1 CloudFront) and BFF/relay (regional); consume existing zone/certs; HTTP→HTTPS / wss-only posture
      status: infra_ready_not_auto_applied
    portal-waf:
      path: modules/portal-waf
      purpose: WAFv2 baseline WebACLs for Portal CloudFront (us-east-1) and public BFF/relay ALBs; CommonRuleSet + KnownBadInputs + optional rate-based
      status: infra_ready_not_auto_applied
    portal-static-edge:
      path: modules/portal-static-edge
      purpose: CloudFront OAC + private S3 static web origin; path-first SPA; pin metadata URL/version/SHA
      status: infra_ready_not_auto_applied
    portal-bff-service:
      path: modules/portal-bff-service
      purpose: Public BFF ALB + Fargate; image digest pin; /health; REDIS_URL via secrets map from portal-valkey; desired_count=1 until G5
      status: infra_ready_not_auto_applied
    portal-relay-service:
      path: modules/portal-relay-service
      purpose: Public relay ALB + Fargate; image digest pin; /health; REDIS_URL via secrets map for bus/jti/leases; desired_count=1 until G6
      status: infra_ready_not_auto_applied
    portal-control-plane-service:
      path: modules/portal-control-plane-service
      purpose: Internal ALB + Fargate control-plane only (G1 private); image digest pin; /health; never public
      status: infra_ready_not_auto_applied
    staging-document-server:
      path: modules/staging-document-server
      purpose: "Staging shared ONLYOFFICE Document Server (topology staging-platform-shared-ds, lp-5q6.34); public Docs ALB + Fargate; SM JWT; Community free-track; not production"
      topology: staging-platform-shared-ds
      status: infra_ready_not_auto_applied
      smoke: scripts/smoke-staging-document-server.sh
      runbook: references/runbooks/staging-document-server.md
      production: false
    account-factory:
      path: modules/account-factory
      purpose: Lanyard-hosted account-per-tenant factory contract (CT/AFT request, SCP JSON, optional in-account baseline KMS/state/roles/budget); no live Organizations API
      status: infra_ready_not_auto_applied
    customer-account-access:
      path: modules/customer-account-access
      purpose: Track B customer-account assume-role + ExternalId + artifact read scope; no long-lived access keys
      status: infra_ready_not_auto_applied
    security-observability:
      path: modules/security-observability
      purpose: Tenant VPC Flow Logs, security SNS, GuardDuty findings bridge; snapshot-age SNS/tag interface + EventBridge SNS policy
  templates:
    tenant:
      path: templates/tenant
      purpose: Per-tenant root module (copy to deployments/<slug>/); optional assume_role (deploy_role_arn/ExternalId), Track A/B backend docs, artifact cross-account modes
      module_sources: relative_local
      track_a_wiring: modules/account-factory
      track_b_wiring: modules/customer-account-access
      smoke: scripts/smoke-tenant-template-wiring.sh
  environments:
    platform-staging:
      path: environments/platform-staging
      purpose: Platform staging compose (VPC, artifacts, RDS, BFF/relay/CP, static edge, optional Valkey + DNS/TLS + WAF + staging Document Server); end-to-end wiring; infra_ready examples only; not apply-ready
      module_sources: relative_local
      status: infra_ready_not_auto_applied
      smoke: scripts/smoke-platform-staging-compose.sh
      runbook: references/runbooks/platform-staging-compose.md
      layers:
        - product-artifact-infra
        - platform-vpc
        - control-plane-rds
        - portal-valkey
        - portal-control-plane-service
        - portal-bff-service
        - portal-relay-service
        - portal-static-edge
        - portal-dns-tls
        - staging-document-server
  deployments:
    example:
      path: deployments/_example-tenant
      purpose: Documentation-only placeholders
  litellm:
    seed:
      path: litellm
      purpose: "LiteLLM multi-slot model_list seed + env.secrets.example for Lanyard Agent (lp-645.8.5)"
  dev:
    lab-shared-compose-ds:
      path: dev/lab-shared-compose-ds
      purpose: "Lab-only ONLYOFFICE Document Server Compose (topology lab-shared-compose-ds, lp-5q6.25); JWT; not production TF"
      topology: lab-shared-compose-ds
      smoke: scripts/smoke-lab-onlyoffice-compose.sh
      runbook: references/runbooks/lab-onlyoffice-document-server.md
      production: false
    mocklab-short-stack-harness:
      path: dev/mocklab-short-stack-harness
      purpose: "Lab-only short-stack harness compose/host runner (lp-oop.30); live form is another Fargate task on existing portal-cp cluster; no new AWS product"
      topology: mocklab-short-stack-harness
      smoke: scripts/smoke-mocklab-short-stack-harness.sh
      runbook: references/runbooks/mocklab-short-stack-harness.md
      production: false
  scripts:
    smoke-customer-account-access:
      path: scripts/smoke-customer-account-access.sh
      purpose: Track B customer-account-access offline smoke
    smoke-account-factory:
      path: scripts/smoke-account-factory.sh
      purpose: Track A account-factory offline smoke (request contract, SCP JSON, baseline honesty)
    smoke-tenant-template-wiring:
      path: scripts/smoke-tenant-template-wiring.sh
      purpose: templates/tenant Track A/B assume_role, ExternalId, backend, artifact wiring offline smoke
    bootstrap-host:
      path: scripts/bootstrap-host.sh
      purpose: Canonical bootstrap (download/verify artifacts; Hermes then client-core; enforce hermes profiles); injected onto hosts
      host_install_path: /usr/local/sbin/company-brain-bootstrap
    ensure-hermes-profiles:
      path: scripts/ensure-hermes-profiles.sh
      purpose: Write/verify admin + contributor Hermes profile seeds (host RBAC enforce path)
    ensure-runtime-hardening:
      path: scripts/ensure-runtime-hardening.sh
      purpose: Unprivileged hermes user, systemd sandbox install, secrets 0600, tool allowlist seeds
    hermes-profiles:
      path: scripts/hermes-profiles
      purpose: Checked-in admin/contributor capability seed templates
    tool-allowlists:
      path: scripts/tool-allowlists
      purpose: Agent tool allowlist seeds aligned with admin/contributor profiles
    omnibox:
      path: scripts/omnibox
      purpose: Mode A Omnibox policy seeds + run-under-omnibox + argv builder + egress render (bwrap_inrepo; no Omnigent server)
    run-under-omnibox:
      path: scripts/omnibox/run-under-omnibox.sh
      purpose: Profile sandbox wrapper for Hermes tool children; OMNIBOX_WRAPPER=/usr/local/sbin/run-under-omnibox
      host_install_path: /usr/local/sbin/run-under-omnibox
      backend: bwrap_inrepo
    build-shell-exec-argv:
      path: scripts/omnibox/build-shell-exec-argv.py
      purpose: Phase 5 Hermes hook argv builder (session profile → run-under-omnibox --profile …); offline --self-test
      host_install_path: /usr/local/sbin/omnibox-build-shell-exec-argv
    host-impacting-tools:
      path: scripts/omnibox/host-impacting-tools.json
      purpose: Registry of host-impacting vs vault-only tools for Omnibox wrap when OMNIBOX_ENABLED=1
      host_install_path: /etc/company-brain/omnibox/host-impacting-tools.json
    render-egress-allowlist:
      path: scripts/omnibox/render-egress-allowlist.sh
      purpose: Phase 6 runtime egress allowlist generator (dry-run safe; output /etc/company-brain/omnibox/runtime/)
      host_install_path: /etc/company-brain/omnibox/runtime/egress.yaml
    ensure-omnibox:
      path: scripts/ensure-omnibox.sh
      purpose: Idempotent Mode A Omnibox host install (bubblewrap, policies, wrapper, hook registry, argv builder, workspaces); --dry-run offline-safe; ENABLE_OMNIBOX / OMNIBOX_REQUIRED
      host_install_paths:
        - /etc/company-brain/omnibox/
        - /var/lib/company-brain/omnibox/
        - /usr/local/sbin/run-under-omnibox
        - /usr/local/sbin/omnibox-build-shell-exec-argv
    smoke-omnibox:
      path: scripts/smoke-omnibox.sh
      purpose: Offline Omnibox Mode A smoke (policy seeds, never_grant .env, ensure --dry-run, phase-5 contributor --profile argv, fail-closed missing seeds)
