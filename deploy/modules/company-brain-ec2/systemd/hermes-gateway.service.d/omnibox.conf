# Omnibox Mode A env for Hermes gateway (cbd-o9s.10 / cbd-o9s.11).
# Does NOT change ExecStart — the long-lived process stays hermes gateway.
# When OMNIBOX_ENABLED=1, Hermes host-impacting tool children must invoke
# OMNIBOX_WRAPPER with session --profile (phase 5 product hook + deploy contract).
# Policies + host-impacting registry live under OMNIBOX_CONFIG_DIR.
# See: references/omnibox-mode-a-hermes-hook.md
#
# user_data writes /etc/company-brain/omnibox.env from Terraform enable_omnibox
# (EnvironmentFile below overrides OMNIBOX_ENABLED when present).
# Break-glass: set OMNIBOX_ENABLED=0 in that file and systemctl daemon-reload + restart.

[Service]
Environment=OMNIBOX_ENABLED=0
Environment=OMNIBOX_CONFIG_DIR=/etc/company-brain/omnibox
Environment=OMNIBOX_WRAPPER=/usr/local/sbin/run-under-omnibox
Environment=OMNIBOX_ARGV_BUILDER=/usr/local/sbin/omnibox-build-shell-exec-argv
EnvironmentFile=-/etc/company-brain/omnibox.env
