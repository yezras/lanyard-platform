# Optional drop-in mirror of primary sandbox knobs (idempotent documentation).
# Primary unit already sets these; this file exists so operators can override
# single directives without rewriting hermes-gateway.service.
#
# Example override:
#   [Service]
#   ReadWritePaths=/opt/company-brain /opt/hermes-lanyard /home/hermes /data

[Service]
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
RestrictSUIDSGID=true
