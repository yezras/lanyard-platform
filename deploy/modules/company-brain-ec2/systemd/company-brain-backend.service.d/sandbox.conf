# Optional drop-in mirror of primary sandbox knobs (idempotent documentation).
# Primary unit already sets these; this file exists so operators can override
# single directives without rewriting company-brain-backend.service.
#
# Example override (secondary vault volume):
#   [Service]
#   ReadWritePaths=/var/lib/company-brain-backend /opt/company-brain /home/company-brain /var/tmp /data
#   Environment=VAULT_ROOT=/data/vault
#
# Example migration (keep Unix user hermes during cutover):
#   [Service]
#   User=hermes
#   Group=hermes
#   Environment=HOME=/home/hermes
#   Environment=BACKEND_HOME=/home/hermes/.hermes
#   Environment=HERMES_HOME=/home/hermes/.hermes
#   EnvironmentFile=-/home/hermes/.hermes/.env
#   WorkingDirectory=/home/hermes/.hermes
#   ReadWritePaths=/home/hermes/.hermes /opt/company-brain /home/hermes /var/tmp

[Service]
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
RestrictSUIDSGID=true
